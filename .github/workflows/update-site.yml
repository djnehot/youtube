name: Update site from YouTube

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min: rebuild only if there is a new upload
    - cron: "15 3 * * *"     # daily 06:15 Istanbul: full refresh (views, likes, subs)
  workflow_dispatch:          # "Run workflow" button in the Actions tab = force rebuild
  push:                       # design/script changed = rebuild right away
    branches: [main]
    paths: [".github/scripts/**", ".github/workflows/update-site.yml"]

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build page
        id: build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FORCE: ${{ github.event_name != 'schedule' || github.event.schedule == '15 3 * * *' }}
        run: python .github/scripts/build_site.py

      - name: Commit and push if changed
        if: steps.build.outputs.message != ''
        run: |
          git config user.name  "DJ Ne-Hot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/last_video_id.txt
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "${{ steps.build.outputs.message }}"
          git push
